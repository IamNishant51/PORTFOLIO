<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Nishant Unavane - Monogram (N & U sharing central stem) -->
  <g stroke="#1E1B18" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- N: Left vertical stem -->
    <path d="M 136 136 V 376" />
    
    <!-- N: Diagonal stroke -->
    <path d="M 136 136 L 256 376" />
    
    <!-- Shared central stem (N right stem / U left stem) -->
    <path d="M 256 136 V 376" />
    
    <!-- U: Lower curve and right vertical arm -->
    <path d="M 256 316 C 256 358 282 376 316 376 C 350 376 376 358 376 316 V 136" />
    
    <!-- Classical hairline terminal serifs -->
    <path d="M 120 136 H 152" stroke-width="12" />
    <path d="M 120 376 H 152" stroke-width="12" />
    <path d="M 240 136 H 272" stroke-width="12" />
    <path d="M 360 136 H 392" stroke-width="12" />
  </g>
</svg>
